name: Phase 2 Platform

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: wepuu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wepuu_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      WEPUU_TEST_DATABASE_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
      CONFORMANCE_DATABASE_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - name: Enable pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install foundation dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict checks
        run: pnpm check
      - name: PostgreSQL migration and isolation tests
        run: pnpm test:database
      - name: Build portable non-root OCI images
        run: |
          docker build --file deploy/Control.Containerfile --tag wepuu-control:candidate .
          docker build --file deploy/Authorization.Containerfile --tag wepuu-authorization:candidate .
          test "$(docker image inspect wepuu-control:candidate --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect wepuu-authorization:candidate --format '{{.Config.User}}')" = "node"
      - name: Local signing production-mode OCI gate
        env:
          WEPUU_OCI_POSTGRES_ADMIN_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
          WEPUU_OCI_CONTAINER_DATABASE_URL: postgresql://postgres:conformance@host.docker.internal:5432/wepuu_test
        run: pnpm test:local-signing:oci
      - name: PostgreSQL backup, restore, and tombstone replay
        run: >-
          WEPUU_POSTGRES_CONTAINER=$(docker ps --filter "ancestor=postgres:16.10-alpine" --format "{{.ID}}" | head -n 1)
          pnpm test:backup
      - name: PHP 8.1 site-proof interoperability
        run: >-
          pnpm build &&
          docker run --rm --mount type=bind,source=${{ github.workspace }}/packages/pairing/test,target=/work,readonly
          wordpress@sha256:f73396626d2f1b89d4c556917c15f55cfcc6b5f80595205516e490f0f04015e4
          php /work/php-site-proof.php |
          node scripts/verify-site-proof-stdin.mjs
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: SBOM and license metadata
        run: env -u NODE_PATH pnpm sbom:check
      - name: Install retained conformance dependencies
        working-directory: spikes/oauth-conformance
        run: npm ci
      - name: Retained OAuth conformance suite
        working-directory: spikes/oauth-conformance
        run: npm run test:persistent
      - name: Contract and evidence checks
        working-directory: spikes/oauth-conformance
        run: npm run check && npm run check:evidence
