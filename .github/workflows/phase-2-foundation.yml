name: Phase 2 Platform

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: wepuu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wepuu_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      WEPUU_TEST_DATABASE_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
      CONFORMANCE_DATABASE_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - name: Enable pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install foundation dependencies
        run: pnpm install --frozen-lockfile
      - name: Prevent isolated PostgreSQL faults echoing synthetic secrets or SQL
        run: |
          database_container=$(docker ps --filter "ancestor=postgres:16.10-alpine" --format "{{.ID}}" | head -n 1)
          test -n "$database_container"
          docker exec "$database_container" psql -U postgres -d wepuu_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET log_min_messages = 'panic'"
          docker exec "$database_container" psql -U postgres -d wepuu_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET log_min_error_statement = 'panic'"
          docker exec "$database_container" psql -U postgres -d wepuu_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
      - name: Validate wpauto VPS deployment manifest
        run: >-
          docker compose
          --env-file deploy/wpauto-vps/runtime.env.example
          --file deploy/wpauto-vps/compose.yaml
          config --quiet
      - name: Strict checks
        run: pnpm check
      - name: Frozen Connector signer PHP 8.2.28 and PHP 8.1.34
        run: |
          python3 tests/fixtures/p3e1a/test_extract.py
          node scripts/test-real-site-proof.mjs
          node scripts/test-real-site-proof.mjs --legacy
      - name: PostgreSQL migration and isolation tests
        run: pnpm test:database
      - name: Rollback send guard on real isolated Nginx
        run: node scripts/test-p3d-rollback-ingress.mjs
      - name: Verify retained production Control source identity before building
        env:
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/wepuu/wp-auto-control@sha256:7c7308a6064740f9f732d2fb12a8f4c4c9dd3fd284edd26cea09df79b976c8fe
          node scripts/verify-control-claims-hotfix-image.mjs --baseline
      - name: Build only Control candidate and reuse fixed Authorization
        run: |
          docker build --file deploy/Control.Containerfile --tag wepuu-control:candidate --label org.opencontainers.image.revision=$(git rev-parse HEAD) --label org.wepuu.source-tree=$(git rev-parse HEAD^{tree}) .
          docker pull ghcr.io/wepuu/wp-auto-authorization@sha256:e4c3f43f57f62098c43aa56d65699bed4ae8ac6d1a9e4c147470f19dbfc49742
          docker tag ghcr.io/wepuu/wp-auto-authorization@sha256:e4c3f43f57f62098c43aa56d65699bed4ae8ac6d1a9e4c147470f19dbfc49742 wepuu-authorization:candidate
          test "$(docker image inspect wepuu-control:candidate --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect wepuu-authorization:candidate --format '{{.Config.User}}')" = "node"
          node scripts/verify-control-claims-hotfix-image.mjs
      - name: Local signing production-mode OCI gate
        env:
          WEPUU_OCI_POSTGRES_ADMIN_URL: postgresql://postgres:conformance@127.0.0.1:5432/wepuu_test
          WEPUU_OCI_CONTAINER_DATABASE_URL: postgresql://postgres:conformance@host.docker.internal:5432/wepuu_test
        run: pnpm test:local-signing:oci
      - name: PostgreSQL backup, restore, and tombstone replay
        run: >-
          WEPUU_POSTGRES_CONTAINER=$(docker ps --filter "ancestor=postgres:16.10-alpine" --format "{{.ID}}" | head -n 1)
          pnpm test:backup
      - name: PHP 8.1 site-proof interoperability
        run: >-
          pnpm build &&
          docker run --rm --mount type=bind,source=${{ github.workspace }}/packages/pairing/test,target=/work,readonly
          wordpress@sha256:f73396626d2f1b89d4c556917c15f55cfcc6b5f80595205516e490f0f04015e4
          php /work/php-site-proof.php |
          node scripts/verify-site-proof-stdin.mjs
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: SBOM and license metadata
        run: env -u NODE_PATH pnpm sbom:check
      - name: Install retained conformance dependencies
        working-directory: spikes/oauth-conformance
        run: npm ci
      - name: Retained OAuth conformance suite
        working-directory: spikes/oauth-conformance
        run: npm run test:persistent
      - name: Contract and evidence checks
        working-directory: spikes/oauth-conformance
        run: npm run check && npm run check:evidence
      - name: Save unpublished Control candidate only
        run: |
          docker save wepuu-control:candidate | gzip -n > .tmp/control-claims-hotfix/image.tar.gz
          node scripts/verify-control-claims-hotfix-image.mjs --archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-claims-hotfix-${{ github.event.pull_request.head.sha || github.sha }}
          path: .tmp/control-claims-hotfix/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-claims-hotfix-manifest-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .tmp/control-claims-hotfix/manifest.json
            .tmp/control-claims-hotfix/baseline.json
            .tmp/control-claims-hotfix/image.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
