name: wepuu-platform

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Control.Containerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - 127.0.0.1:3000:3000
    secrets:
      - source: signing_keyring
        target: signing_keyring
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: signing_private_key
        target: signing_private_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: signing_passphrase
        target: signing_passphrase
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: account_auth_secrets
        target: account_auth_secrets
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: resend_api_key
        target: resend_api_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      WEPUU_DEPLOYMENT_MODE: ${WEPUU_DEPLOYMENT_MODE:?}
      WEPUU_DATABASE_URL: ${WEPUU_DATABASE_URL:?}
      WEPUU_CONTROL_PUBLIC_ORIGIN: ${WEPUU_CONTROL_PUBLIC_ORIGIN:?}
      WEPUU_ACCOUNT_AUTH_SECRETS_FILE: /run/secrets/account_auth_secrets
      WEPUU_EMAIL_DELIVERY: resend
      WEPUU_RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      WEPUU_RESEND_FROM: ${WEPUU_RESEND_FROM:?}
      WEPUU_RESEND_REPLY_TO: ${WEPUU_RESEND_REPLY_TO:-}
      WEPUU_EMAIL_OTP_SEND_WINDOW_SECONDS: ${WEPUU_EMAIL_OTP_SEND_WINDOW_SECONDS:-60}
      WEPUU_EMAIL_OTP_SEND_MAX: ${WEPUU_EMAIL_OTP_SEND_MAX:-1}
      WEPUU_EMAIL_OTP_VERIFY_WINDOW_SECONDS: ${WEPUU_EMAIL_OTP_VERIFY_WINDOW_SECONDS:-300}
      WEPUU_EMAIL_OTP_VERIFY_MAX: ${WEPUU_EMAIL_OTP_VERIFY_MAX:-5}
      WEPUU_ISSUER: ${WEPUU_ISSUER:?}
      WEPUU_SIGNING_KEYRING_FILE: /run/secrets/signing_keyring
      WEPUU_SIGNING_KEY_SLOT: ${WEPUU_SIGNING_KEY_SLOT:?}
      WEPUU_GRANT_IDEMPOTENCY_HMAC_KEY: ${WEPUU_GRANT_IDEMPOTENCY_HMAC_KEY:?}
      WEPUU_LEGAL_PROVIDER_NAME: ${WEPUU_LEGAL_PROVIDER_NAME:?}
      WEPUU_TERMS_URL: ${WEPUU_TERMS_URL:?}
      WEPUU_PRIVACY_URL: ${WEPUU_PRIVACY_URL:?}
      WEPUU_SUPPORT_URL: ${WEPUU_SUPPORT_URL:?}
      WEPUU_STATUS_URL: ${WEPUU_STATUS_URL:?}
      WEPUU_DATA_REGION_LABEL: ${WEPUU_DATA_REGION_LABEL:?}
      WEPUU_TRUSTED_PROXY_CIDRS_JSON: ${WEPUU_TRUSTED_PROXY_CIDRS_JSON:?}
      WEPUU_RELEASE_VERSION: ${WEPUU_RELEASE_VERSION:?}
      WEPUU_RELEASE_REVISION: ${WEPUU_RELEASE_REVISION:?}
      WEPUU_IDENTITY_PROVIDER_LABEL: ${WEPUU_IDENTITY_PROVIDER_LABEL:?}
      WEPUU_RETENTION_POLICY_VERSION: ${WEPUU_RETENTION_POLICY_VERSION:?}
      WEPUU_COMPATIBILITY_MATRIX_VERSION: ${WEPUU_COMPATIBILITY_MATRIX_VERSION:?}
      WEPUU_OPERATIONS_METRICS_TOKEN: ${WEPUU_OPERATIONS_METRICS_TOKEN:?}

  authorization:
    build:
      context: ..
      dockerfile: deploy/Authorization.Containerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - 127.0.0.1:3001:3001
    secrets:
      - source: signing_keyring
        target: signing_keyring
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: signing_private_key
        target: signing_private_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: signing_passphrase
        target: signing_passphrase
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: account_auth_secrets
        target: account_auth_secrets
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      WEPUU_DEPLOYMENT_MODE: ${WEPUU_DEPLOYMENT_MODE:?}
      WEPUU_AUTH_HOST: 0.0.0.0
      WEPUU_AUTH_PORT: 3001
      WEPUU_DATABASE_URL: ${WEPUU_DATABASE_URL:?}
      WEPUU_CONTROL_PUBLIC_ORIGIN: ${WEPUU_CONTROL_PUBLIC_ORIGIN:?}
      WEPUU_ACCOUNT_AUTH_SECRETS_FILE: /run/secrets/account_auth_secrets
      WEPUU_ISSUER: ${WEPUU_ISSUER:?}
      WEPUU_COOKIE_KEYS_JSON: ${WEPUU_COOKIE_KEYS_JSON:?}
      WEPUU_OAUTH_ARTIFACT_KEYS_JSON: ${WEPUU_OAUTH_ARTIFACT_KEYS_JSON:?}
      WEPUU_RATE_LIMIT_HMAC_KEY: ${WEPUU_RATE_LIMIT_HMAC_KEY:?}
      WEPUU_LEGAL_PROVIDER_NAME: ${WEPUU_LEGAL_PROVIDER_NAME:?}
      WEPUU_TERMS_URL: ${WEPUU_TERMS_URL:?}
      WEPUU_PRIVACY_URL: ${WEPUU_PRIVACY_URL:?}
      WEPUU_SUPPORT_URL: ${WEPUU_SUPPORT_URL:?}
      WEPUU_STATUS_URL: ${WEPUU_STATUS_URL:?}
      WEPUU_DATA_REGION_LABEL: ${WEPUU_DATA_REGION_LABEL:?}
      WEPUU_TRUSTED_PROXY_CIDRS_JSON: ${WEPUU_TRUSTED_PROXY_CIDRS_JSON:?}
      WEPUU_RELEASE_VERSION: ${WEPUU_RELEASE_VERSION:?}
      WEPUU_RELEASE_REVISION: ${WEPUU_RELEASE_REVISION:?}
      WEPUU_IDENTITY_PROVIDER_LABEL: ${WEPUU_IDENTITY_PROVIDER_LABEL:?}
      WEPUU_RETENTION_POLICY_VERSION: ${WEPUU_RETENTION_POLICY_VERSION:?}
      WEPUU_COMPATIBILITY_MATRIX_VERSION: ${WEPUU_COMPATIBILITY_MATRIX_VERSION:?}
      WEPUU_SIGNING_KEYRING_FILE: /run/secrets/signing_keyring
      WEPUU_SIGNING_KEY_SLOT: ${WEPUU_SIGNING_KEY_SLOT:?}
      WEPUU_OPERATIONS_METRICS_TOKEN: ${WEPUU_OPERATIONS_METRICS_TOKEN:?}

secrets:
  signing_keyring:
    file: ${WEPUU_SIGNING_KEYRING_HOST_FILE:?}
  signing_private_key:
    file: ${WEPUU_SIGNING_PRIVATE_KEY_HOST_FILE:?}
  signing_passphrase:
    file: ${WEPUU_SIGNING_PASSPHRASE_HOST_FILE:?}
  account_auth_secrets:
    file: ${WEPUU_ACCOUNT_AUTH_SECRETS_HOST_FILE:?}
  resend_api_key:
    file: ${WEPUU_RESEND_API_KEY_HOST_FILE:?}
