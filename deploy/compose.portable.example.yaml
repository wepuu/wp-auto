name: wepuu-platform

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Control.Containerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - 127.0.0.1:3000:3000
    environment:
      WEPUU_DEPLOYMENT_MODE: ${WEPUU_DEPLOYMENT_MODE:?}
      WEPUU_DATABASE_URL: ${WEPUU_DATABASE_URL:?}
      WEPUU_CONTROL_PUBLIC_ORIGIN: ${WEPUU_CONTROL_PUBLIC_ORIGIN:?}
      WEPUU_ACCOUNT_OIDC_ISSUER: ${WEPUU_ACCOUNT_OIDC_ISSUER:?}
      WEPUU_ACCOUNT_OIDC_CLIENT_ID: ${WEPUU_ACCOUNT_OIDC_CLIENT_ID:?}
      WEPUU_ACCOUNT_OIDC_CLIENT_SECRET: ${WEPUU_ACCOUNT_OIDC_CLIENT_SECRET:?}
      WEPUU_ACCOUNT_OIDC_REDIRECT_URI: ${WEPUU_ACCOUNT_OIDC_REDIRECT_URI:?}
      WEPUU_ACCOUNT_OIDC_SCOPES: openid
      WEPUU_ACCOUNT_OIDC_CLIENT_AUTH_METHOD: client_secret_basic
      WEPUU_OIDC_TRANSACTION_KEYS_JSON: ${WEPUU_OIDC_TRANSACTION_KEYS_JSON:?}
      WEPUU_IDENTITY_SUBJECT_HMAC_KEY: ${WEPUU_IDENTITY_SUBJECT_HMAC_KEY:?}
      WEPUU_ISSUER: ${WEPUU_ISSUER:?}
      WEPUU_KMS_KEY_ID: ${WEPUU_KMS_KEY_ID:?}
      WEPUU_KMS_KID: ${WEPUU_KMS_KID:?}
      WEPUU_GRANT_IDEMPOTENCY_HMAC_KEY: ${WEPUU_GRANT_IDEMPOTENCY_HMAC_KEY:?}
      WEPUU_LEGAL_PROVIDER_NAME: ${WEPUU_LEGAL_PROVIDER_NAME:?}
      WEPUU_TERMS_URL: ${WEPUU_TERMS_URL:?}
      WEPUU_PRIVACY_URL: ${WEPUU_PRIVACY_URL:?}
      WEPUU_SUPPORT_URL: ${WEPUU_SUPPORT_URL:?}
      WEPUU_STATUS_URL: ${WEPUU_STATUS_URL:?}
      WEPUU_DATA_REGION_LABEL: ${WEPUU_DATA_REGION_LABEL:?}
      WEPUU_TRUSTED_PROXY_CIDRS_JSON: ${WEPUU_TRUSTED_PROXY_CIDRS_JSON:?}
      AWS_REGION: ${AWS_REGION:?}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}

  authorization:
    build:
      context: ..
      dockerfile: deploy/Authorization.Containerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - 127.0.0.1:3001:3001
    environment:
      WEPUU_DEPLOYMENT_MODE: ${WEPUU_DEPLOYMENT_MODE:?}
      WEPUU_AUTH_HOST: 0.0.0.0
      WEPUU_AUTH_PORT: 3001
      WEPUU_DATABASE_URL: ${WEPUU_DATABASE_URL:?}
      WEPUU_CONTROL_PUBLIC_ORIGIN: ${WEPUU_CONTROL_PUBLIC_ORIGIN:?}
      WEPUU_ISSUER: ${WEPUU_ISSUER:?}
      WEPUU_COOKIE_KEYS_JSON: ${WEPUU_COOKIE_KEYS_JSON:?}
      WEPUU_ARTIFACT_HMAC_KEYS_JSON: ${WEPUU_ARTIFACT_HMAC_KEYS_JSON:?}
      WEPUU_RATE_LIMIT_HMAC_KEY: ${WEPUU_RATE_LIMIT_HMAC_KEY:?}
      WEPUU_LEGAL_PROVIDER_NAME: ${WEPUU_LEGAL_PROVIDER_NAME:?}
      WEPUU_TERMS_URL: ${WEPUU_TERMS_URL:?}
      WEPUU_PRIVACY_URL: ${WEPUU_PRIVACY_URL:?}
      WEPUU_SUPPORT_URL: ${WEPUU_SUPPORT_URL:?}
      WEPUU_STATUS_URL: ${WEPUU_STATUS_URL:?}
      WEPUU_DATA_REGION_LABEL: ${WEPUU_DATA_REGION_LABEL:?}
      WEPUU_TRUSTED_PROXY_CIDRS_JSON: ${WEPUU_TRUSTED_PROXY_CIDRS_JSON:?}
      AWS_REGION: ${AWS_REGION:?}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
