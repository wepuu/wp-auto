server {
    listen 80;
    server_name app.wpauto.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/wpauto/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.wpauto.cc;

    ssl_certificate /www/server/panel/vhost/cert/app.wpauto.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/app.wpauto.cc/privkey.pem;

    include /opt/wpauto/config/cloudflare-realip.conf;

    client_max_body_size 128k;

    location = /internal/metrics {
        return 404;
    }

    location ~ ^/(?:\.well-known(?:/.*)?|auth(?:/.*)?|token(?:/.*)?|jwks|interaction(?:/.*)?|api/auth(?:/.*)?)$ {
        return 404;
    }

    location ~ ^/v1/(?:account/(?:login|email|bootstrap|session|logout|console)(?:/|$)|pairing(?:/|$)|consent(?:/|$)|oauth(?:/|$)) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
