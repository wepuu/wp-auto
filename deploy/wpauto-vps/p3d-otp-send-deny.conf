# Rollback safety: include INSIDE the existing auth.wpauto.cc HTTPS server.
# Do not install unless P3-D4 explicitly authorizes this temporary ingress guard.
location = /v1/account/email/send { return 503; }
location = /v1/account/email/resend { return 503; }
# Raw Better Auth API is not public, including encoded/normalized subpaths.
location ^~ /api/auth/ { return 404; }
