server {
    listen 80;
    server_name auth.wpauto.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/wpauto/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.wpauto.cc;

    ssl_certificate /www/server/panel/vhost/cert/auth.wpauto.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/auth.wpauto.cc/privkey.pem;

    include /opt/wpauto/config/cloudflare-realip.conf;

    client_max_body_size 128k;

    location = /internal/metrics {
        return 404;
    }

    location ~ ^/(?:\.well-known/(?:openid-configuration|oauth-authorization-server)|auth(?:/.*)?|token(?:/revocation)?|jwks|interaction(?:/.*)?)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(?:terms|privacy|support|status)$ {
        root /opt/wpauto/legal;
        try_files $uri.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
