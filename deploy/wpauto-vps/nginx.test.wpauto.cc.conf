server {
    listen 80;
    server_name test.wpauto.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/wpauto-wordpress-e2e/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.wpauto.cc;

    ssl_certificate /www/server/panel/vhost/cert/test.wpauto.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/test.wpauto.cc/privkey.pem;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
