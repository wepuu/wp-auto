services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conformance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: conformance
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conformance"]
      interval: 2s
      timeout: 2s
      retries: 15

  fixture:
    profiles: ["https-fixture"]
    image: node:24.21.0-alpine
    working_dir: /work
    command: ["node", "scripts/serve-https-fixture.mjs"]
    environment:
      CONFORMANCE_DATABASE_URL: postgresql://postgres:conformance@postgres:5432/conformance
      CONFORMANCE_ISSUER: https://auth.example.test
      CONFORMANCE_RESOURCE: https://site-a.example.test/wp-json/wp-auto/mcp
    volumes:
      - ./:/work
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:19001/.well-known/openid-configuration'),fetch('http://127.0.0.1:19002/.well-known/oauth-protected-resource/wp-json/wp-auto/mcp')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  caddy:
    profiles: ["https-fixture"]
    image: caddy:2.10.2-alpine
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  caddy-data:
  caddy-config:
